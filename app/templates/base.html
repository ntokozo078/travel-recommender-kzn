<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Travel KZN{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav style="background: white; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
            <a href="/" style="font-weight: 700; font-size: 1.5rem; text-decoration: none; color: #333;">
                <i class="fas fa-route" style="color: #007bff;"></i> Travel<span style="color: #007bff;">KZN</span>
            </a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer style="background: #333; color: white; padding: 2rem; text-align: center; margin-top: 3rem;">
        <p>&copy; 2025 Travel Recommendation System | Data Engineering Portfolio</p>
    </footer>

</body>
</html>
